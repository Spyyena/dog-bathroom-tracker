# Paste the `dog-tracker:` service under the `services:` key of your compose.yaml.
# Builds from local source, so `docker compose pull` skips it.
# Update after code changes:  docker compose up -d --build dog-tracker
#
# Secrets go in a .env next to compose.yaml (never commit it):
#   DISPLAY_TOKEN, USERS, SESSION_SECRET, API_TOKEN
# See README.md -> Quick start / Authentication.

services:
  dog-tracker:
    container_name: dog-tracker
    build: ./dog-tracker
    ports:
      - "5007:5007"
    environment:
      - TZ=America/Denver
      - DISPLAY_TOKEN=${DISPLAY_TOKEN:-}
      - DISPLAY_HEADER=X-Display-Token
      - RETENTION_DAYS=30
      - GROUP_WINDOW_SECONDS=1200
      - DISPLAY_ROWS=5
      - BINGO_COOLDOWN_SECONDS=3600
      # Auth: secret values live in .env
      - USERS=${USERS:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - API_TOKEN=${API_TOKEN:-}
      - SESSION_DAYS=90
    volumes:
      - ./dog-tracker/data:/app/data    # SQLite lives here, on the host
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5007/healthz').status==200 else 1)\""]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
